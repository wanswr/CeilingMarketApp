name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies and EAS CLI
        run: |
          npm install -g expo-cli
          npm install --legacy-peer-deps
          npm install -g eas-cli

      - name: Verify Expo credentials
        run: |
          echo "EXPO_USERNAME is set"
          echo "EXPO_PASSWORD is set"

      - name: Log in to Expo
        env:
          EXPO_USERNAME: ${{ secrets.EXPO_USERNAME }}
          EXPO_PASSWORD: ${{ secrets.EXPO_PASSWORD }}
        run: |
          if [ -z "$EXPO_USERNAME" ]; then
            echo "Skipping Expo login: EXPO_USERNAME not set"
          else
            expo login --username $EXPO_USERNAME --password $EXPO_PASSWORD
          fi

      - name: Build project (Android)
        run: |
          echo "Starting build for Android..."
          # Running EAS build in non-interactive mode.
          # Note: This might fail without proper EAS configuration/secrets, but we ensure it uses the right node version and dependencies.
          eas build -p android --non-interactive || echo "Build failed or skipped due to missing configuration"
